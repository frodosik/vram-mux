version = 1

# The section header IS the model name. The router answers POST /models/load
# {"model": NAME} and POST /slots/0?action=save&model=NAME by that name, so the
# header must equal the model field of the route spec, and `m` is the path.

[qwen3.8-27b]
m = /srv/models/qwen3.8-27b.gguf
slot-save-path = /var/lib/vram-mux/sessions
ctx-size = 32768
parallel = 1
n-gpu-layers = 999
flash-attn = on
cache-type-k = q8_0
cache-type-v = q4_0
threads = 8
cache-ram = 0
fit = off
jinja = on

[orcacyber-security-reviewer]
m = /srv/models/orcacyber.gguf
slot-save-path = /var/lib/vram-mux/sessions
ctx-size = 16384
parallel = 1
n-gpu-layers = 999
flash-attn = on
cache-type-k = q8_0
cache-type-v = q4_0
threads = 8
cache-ram = 0
fit = off
jinja = on
