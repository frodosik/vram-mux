# llama.cpp model presets for the router: one section per preset, loaded on
# demand by the arbiter through POST /models/load. `alias` is the model name a
# client puts in its request, and it must equal the route spec's model field.

[27b]
model = /srv/models/qwen3.8-27b.gguf
alias = qwen3.8-27b
ctx-size = 32768

[orcacyber]
model = /srv/models/orcacyber.gguf
alias = orcacyber-security-reviewer
ctx-size = 16384
