version: 2

project_name: gpu-arbiter

builds:
  - id: gpu-arbiter
    binary_name: gpu-arbiter
    main: ./cmd/gpu-arbiter
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    files: [README.md, LICENSE, CHANGELOG.md, contrib/*]

checksum:
  name_template: checksums.txt
